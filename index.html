<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Cash Cannon</title>
    <style>
      :root { color-scheme: dark; --ink: #eafff1; --green: #34d17e; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #04120b; overflow: hidden; }
      body { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--ink); }

      #feed { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
      #cam { position: fixed; width: 2px; height: 2px; opacity: 0; pointer-events: none; left: -10px; }

      /* Minimal entry gate (one tap is needed for camera + audio permission). */
      .gate {
        position: fixed; inset: 0; z-index: 3;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 18px; text-align: center; padding: 24px;
        background: radial-gradient(120% 120% at 50% 40%, #0a2417 0%, #04120b 70%);
      }
      .hidden { display: none !important; }
      .hint { margin: 0; max-width: 32ch; font-size: clamp(15px, 2.4vw, 18px); line-height: 1.5; color: rgba(234, 255, 241, 0.82); }
      .btn {
        appearance: none; border: 0; cursor: pointer; font: inherit; font-weight: 700; font-size: 17px;
        color: #06180e; min-height: 52px; padding: 0 32px; border-radius: 999px;
        background: linear-gradient(180deg, #8ff2b5, var(--green) 55%, #1f9e5e);
        box-shadow: 0 10px 30px rgba(52, 209, 126, 0.35);
        transition: transform 0.12s ease, filter 0.2s ease;
      }
      .btn:hover { transform: translateY(-1px); filter: brightness(1.05); }
      .btn:active { transform: translateY(0) scale(0.98); }
      .btn:focus-visible { outline: 3px solid #f2d98a; outline-offset: 3px; }
      #errorMsg { max-width: 34ch; opacity: 0.9; line-height: 1.55; }

      /* Sound toggle (SVG, not emoji) */
      #sound {
        position: fixed; top: 14px; right: 14px; z-index: 5;
        width: 44px; height: 44px; border-radius: 50%; cursor: pointer;
        display: none; align-items: center; justify-content: center; color: var(--ink);
        border: 1px solid rgba(255, 255, 255, 0.18); background: rgba(6, 22, 13, 0.5); backdrop-filter: blur(8px);
      }
      #sound:hover { border-color: rgba(255, 255, 255, 0.4); }
      #sound:focus-visible { outline: 3px solid #f2d98a; outline-offset: 3px; }
      #sound .ic { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      #sound .ic-off { display: none; }
      #sound.muted { color: rgba(234, 255, 241, 0.55); }
      #sound.muted .ic-on { display: none; }
      #sound.muted .ic-off { display: block; }

      /* "Make it rain" toggle */
      #rain {
        position: fixed; top: 14px; left: 14px; z-index: 5;
        display: none; align-items: center; min-height: 44px; padding: 0 18px;
        border-radius: 999px; cursor: pointer; font: inherit; font-weight: 600; font-size: 14px;
        color: var(--ink); border: 1px solid rgba(255, 255, 255, 0.18);
        background: rgba(6, 22, 13, 0.5); backdrop-filter: blur(8px);
        transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
      }
      #rain:hover { border-color: rgba(255, 255, 255, 0.4); }
      #rain:focus-visible { outline: 3px solid #f2d98a; outline-offset: 3px; }
      #rain.on {
        color: #06180e; border-color: transparent; font-weight: 700;
        background: linear-gradient(180deg, #8ff2b5, var(--green) 55%, #1f9e5e);
      }
    </style>
  </head>
  <body>
    <canvas id="feed"></canvas>
    <video id="cam" playsinline muted></video>

    <button id="sound" type="button" aria-label="Mute sound" aria-pressed="true" title="Sound">
      <svg class="ic ic-on" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor" stroke="none" />
        <path d="M15.4 8.6a5 5 0 0 1 0 6.8" />
        <path d="M18.3 5.7a9 9 0 0 1 0 12.6" />
      </svg>
      <svg class="ic ic-off" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor" stroke="none" />
        <path d="m16 9 5 6" />
        <path d="m21 9-5 6" />
      </svg>
    </button>

    <button id="rain" type="button" aria-pressed="false" aria-label="Toggle money rain">Make it rain</button>

    <div id="start" class="gate">
      <p id="hint" class="hint">Make a finger gun and hold the shape to shoot cash. Point to aim.</p>
      <button id="startBtn" class="btn" type="button">Start camera</button>
    </div>

    <div id="error" class="gate hidden">
      <p id="errorMsg" class="hint"></p>
      <button id="retryBtn" class="btn" type="button">Try again</button>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
